<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#684d95" />
    <title>ProgramaPaso</title>

    <!-- Se queda en "/": el workflow lo cambia solo a /ProgramaPaso/ al publicar -->
    <base href="/" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Marcadores que el SDK de .NET 10 reemplaza al compilar y publicar: no tocar -->
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet" />

    <!-- Aplica el tema guardado antes de pintar la página (evita un parpadeo de tema claro) -->
    <script>try{var t=localStorage.getItem('pp_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Nuestros scripts van ANTES del de Blazor -->
    <script src="js/app.js"></script>
    <script src="js/code-runner.js"></script>

    <!-- El #[.{fingerprint}] es un marcador del SDK: se escribe tal cual -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
